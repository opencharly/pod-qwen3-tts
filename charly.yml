qwen3-tts:
    candy:
        description: |
            Qwen3-TTS speech service — the OpenAI-compatible speech routes Open WebUI's
            `openai` TTS engine calls (POST /v1/audio/speech, GET /v1/audio/voices), served
            over the upstream `qwen-tts` python API by a charly-owned FastAPI shim.
            The public shim holds NO model: it starts an on-demand worker process (torch +
            qwen-tts) on the first synthesis request, waits (bounded) for enough free VRAM
            before spawning it, and kills the worker after 10 idle minutes — so at rest the
            pod uses no VRAM at all, including no CUDA context. /health is the readiness
            signal (503 with a machine-readable reason while unloaded, waiting for VRAM or
            loading; 200 once the worker serves); a failed start is retried by the next
            request, never sticky; and every request is validated before anything starts (a
            foreign model id or an unsupported response_format is a 4xx naming what this
            server does serve). Observable: the running `qwen3-tts` service, /health saying
            `unloaded` at start, a synthesis returning real audio (wav, mp3, flac or pcm),
            the worker pid appearing in /health and disappearing after the idle TTL, and the
            GPU returning to its pre-load free-memory level.
        require:
            - '@github.com/opencharly/layer-python:v2026.314.0709'
            - '@github.com/opencharly/layer-supervisord:v2026.314.0710'
        # torch/triton JIT-compile kernels at synthesis time and need a C compiler in the
        # image; a bare Fedora base fails synthesis with "Failed to find C compiler".
        # The NAME is distro-specific: Fedora splits the C++ driver into gcc-c++,
        # while Arch/CachyOS ships it inside `gcc` (no gcc-c++ package exists there),
        # so the per-distro section adds only what each one needs.
        package:
            - gcc
        distro:
            fedora:
                package:
                    - gcc-c++
        env:
            # A host-owned bind makes charly run the container as root under its keep-id
            # mapping, where the runtime HOME is /root — while the server, its checks and
            # its cache live under the image user's home. Pin both, so a bound deployment
            # behaves like the unbound one and the checkpoint cache always lands in the
            # `models` volume that is mounted at ~/.cache/huggingface.
            HOME: "/home/user"
            HF_HOME: "/home/user/.cache/huggingface"
            QWEN3_TTS_MODEL: "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
            QWEN3_TTS_PORT: "8000"
            QWEN3_TTS_VOICE: "vivian"
            QWEN3_TTS_DEVICE: "cuda:0"
            # Load nothing at start: the checkpoint is loaded only when a synthesis
            # request arrives, and the worker that holds it is killed after this many idle
            # seconds (0 = never). Killing the PROCESS releases the CUDA context too, not
            # just the weights — the whole point of the worker split.
            QWEN3_TTS_IDLE_UNLOAD_S: "600"
            # The free-VRAM floor (MiB) and the bounded wait before the worker is spawned.
            # `0` disables the gate (a deliberate CPU deployment); QWEN3_TTS_DEVICE=cpu
            # also skips it. Set the floor from the worker's MEASURED peak, not a guess.
            QWEN3_TTS_GPU_MIN_FREE_MIB: "4096"
            QWEN3_TTS_GPU_WAIT_SECONDS: "600"
        # The consumer side of this contract is pod-openwebui's env_accept:
        # QWEN3_TTS_HOST is the BASE URL (ending in /v1), and the served model id travels
        # with it because Open WebUI forces a `model` into every speech request.
        env_provide:
            QWEN3_TTS_HOST: "http://{{.ContainerName}}:8000/v1"
            QWEN3_TTS_SERVED_MODEL: "Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
            QWEN3_TTS_VOICE: "vivian"
        port:
            - 8000
        volume:
            - name: models
              path: "~/.cache/huggingface"
        service:
            - name: qwen3-tts
              exec: "%(ENV_HOME)s/.local/bin/qwen3-tts-server.py"
              # The shim's shutdown must reap the worker before supervisord escalates.
              stop_timeout: 30
              restart: always
              enable: true
        plan:
            - run: create the model cache directory in the user's home
              mkdir: "${HOME}/.cache/huggingface"
              run_as: "${USER}"
            - run: create the user binary directory
              mkdir: "${HOME}/.local/bin"
              run_as: "${USER}"
            - run: install the charly-owned public speech shim
              copy: qwen3-tts-server.py
              to: "${HOME}/.local/bin/qwen3-tts-server.py"
              mode: "0755"
              run_as: "${USER}"
            - run: install the on-demand speech worker
              copy: qwen3-tts-worker.py
              to: "${HOME}/.local/bin/qwen3-tts-worker.py"
              mode: "0755"
              run_as: "${USER}"
            - run: install the shared qwen3-tts constants and helpers
              copy: qwen3_tts_common.py
              to: "${HOME}/.local/bin/qwen3_tts_common.py"
              mode: "0644"
              run_as: "${USER}"
            - run: install the shim/worker surface test the plan runs
              copy: tests/test_surface.py
              to: "${HOME}/.local/bin/test_surface.py"
              mode: "0644"
              run_as: "${USER}"
            - run: install the pure-contract test the plan runs
              copy: tests/test_common.py
              to: "${HOME}/.local/bin/test_common.py"
              mode: "0644"
              run_as: "${USER}"
            - run: install the torch-free guard the plan runs
              copy: tests/test_torch_free.py
              to: "${HOME}/.local/bin/test_torch_free.py"
              mode: "0644"
              run_as: "${USER}"
            - run: install the NVML-gate test the plan runs
              copy: tests/test_nvml_gate.py
              to: "${HOME}/.local/bin/test_nvml_gate.py"
              mode: "0644"
              run_as: "${USER}"
            - check: the public speech shim is present and executable
              file:
                file: ${HOME}/.local/bin/qwen3-tts-server.py
                exists: true
                mode: "0755"
            - check: the on-demand speech worker is present and executable
              file:
                file: ${HOME}/.local/bin/qwen3-tts-worker.py
                exists: true
                mode: "0755"
            - check: the shared constants module is present
              file:
                file: ${HOME}/.local/bin/qwen3_tts_common.py
                exists: true
            - check: the pixi environment provides torch, soundfile, httpx and the web stack
              exit_status: 0
              command: python3 -c 'import torch, soundfile, fastapi, uvicorn, httpx; print("env-ok", torch.__version__)'
            - check: the qwen-tts package the server imports resolves in the pixi environment
              exit_status: 0
              command: python3 -c 'import qwen_tts; print("qwen-tts-ok")'
            # The three checks below pin the shim/worker split on a container with no
            # checkpoint and no GPU. The surface check drives a STUB worker over the real
            # UDS path: nothing at boot, one spawn per burst, the VRAM gate in both
            # directions, the idle kill, the reload, and a failed start retried by the next
            # request. The common check asserts the encoding/voice/readiness contracts. The
            # torch-free check is the guard that keeps the idle kill total.
            - check: the shim starts nothing at boot, starts one worker per burst, gates on free VRAM, and kills it on idle
              id: qwen3-tts-surface
              exit_status: 0
              timeout: 10m
              command: python3 /home/user/.local/bin/test_surface.py
            - check: the encoding, voice, readiness and state-machine contracts hold without a checkpoint
              id: qwen3-tts-contracts
              exit_status: 0
              command: python3 /home/user/.local/bin/test_common.py
            - check: the public shim imports no torch or qwen_tts, so the idle kill releases ALL VRAM
              id: qwen3-tts-torch-free
              exit_status: 0
              command: python3 /home/user/.local/bin/test_torch_free.py
            - check: the free-VRAM gate reads NVML through the injected library, not the nvidia-smi CLI
              id: qwen3-tts-nvml-gate
              exit_status: 0
              timeout: 2m
              command: python3 /home/user/.local/bin/test_nvml_gate.py


